# Build the demo from public/ and publish it to GitHub Pages.
#
# The demo is generated, never hand-edited: scripts/build-demo.mjs re-derives
# docs/ from the same public/ the local console serves, so the hosted page
# cannot drift from the app you run.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the demo
        run: npm run build:demo
      - name: Fail if committed docs/ is stale
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is out of date. Run 'npm run build:demo' and commit the result."
            git diff --stat -- docs
            exit 1
          fi
      # NOTE: `enablement: true` does not work here — the workflow token gets
      # "Resource not accessible by integration" on create-a-pages-site. The
      # Pages site has to be created once by a repo admin:
      #   Settings → Pages → Source: GitHub Actions
      # After that this step succeeds and every push publishes.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
